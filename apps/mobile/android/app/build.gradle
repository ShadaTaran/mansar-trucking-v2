apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Resolve npm packages through Node so the root-hoisted workspace install is
// found (the template's ../../node_modules defaults assume a standalone app).
def nodePackageDir = { String pkg ->
    new File(["node", "--print", "require.resolve('${pkg}/package.json')"]
        .execute(null, rootDir).text.trim()).parentFile
}

/**
 * This is the configuration block to customize your React Native Android app.
 * Only the workspace-related folders are set; everything else keeps the
 * React Native Gradle plugin defaults.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives.
    root = file("../../")
    //   The folder where the react-native NPM package is (root-hoisted).
    reactNativeDir = nodePackageDir("react-native")
    //   The folder where the react-native Codegen package is (root-hoisted).
    codegenDir = nodePackageDir("@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint.
    cliFile = new File(nodePackageDir("react-native"), "cli.js")
    //   The Hermes compiler used to bundle JS into non-debug variants
    //   (staging, release). The plugin's default looks under apps/mobile's
    //   own node_modules; the workspace hoists hermes-compiler to the root.
    hermesCommand = new File(
        nodePackageDir("hermes-compiler"),
        "hermesc/%OS-BIN%/" + (System.getProperty("os.name").toLowerCase().contains("windows") ? "hermesc.exe" : "hermesc")
    ).path

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mansar.driver"
    defaultConfig {
        applicationId "com.mansar.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    // The API endpoint is build-time configuration (not a secret) exposed to
    // JavaScript through BuildConfig.MANSAR_API_BASE_URL and the MansarConfig
    // native module. Each build type fixes its own value; there is no
    // runtime override and no production endpoint yet.
    buildFeatures {
        buildConfig true
    }
    // Debug builds use the Android Gradle Plugin's standard debug signing
    // (~/.android/debug.keystore, generated automatically). No keystore is
    // stored in the repository. Release signing is configured in a later stage.
    buildTypes {
        debug {
            // Local development: the Android emulator reaches the host's API
            // through 10.0.2.2. Plain HTTP is allowed here only (the React
            // Native Gradle plugin sets usesCleartextTraffic=true for debug).
            buildConfigField "String", "MANSAR_API_BASE_URL", '"http://10.0.2.2:3001"'
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // No approved production endpoint exists: an empty value makes the
            // app fail closed (no API client, no network) instead of inheriting
            // the development or staging URL. Release remains unsigned.
            buildConfigField "String", "MANSAR_API_BASE_URL", '""'
        }
        // Staging: a release-like, non-debuggable build that carries its own
        // JS bundle (no Metro), installs beside the debug app under its own
        // application id, talks HTTPS only, and is signed with the automatic
        // debug keystore because it is never distributed.
        staging {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ["release"]
            // The React Native Gradle plugin only sets this placeholder for
            // debug/release; a custom build type must set it explicitly.
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            buildConfigField "String", "MANSAR_API_BASE_URL", '"https://mansar-api-staging.up.railway.app"'
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
